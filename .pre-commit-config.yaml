fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: 64c481773cdeda96800dac9ee8f8740e373e44ce # frozen: v2.6.7
    hooks:
      - id: biome-format
        exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
        groups: [format]
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.18.0
    hooks:
      - id: panache-format
        groups: [format]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 3c6e76e10abcae02303212289efed3413350769c # frozen: v2.30.6
    hooks:
      - id: pyproject-fmt
        groups: [format]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        groups: [format]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: hatch check types
        language: system
        types: [python]
        files: ^(src|tests)/
        require_serial: true
        pass_filenames: false
        groups: [typecheck]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
        groups: [format]
      - id: mixed-line-ending
        exclude: ^\.cruft\.json$ # inconsistent file endings on windows - file never to be modified manually.
        args: [--fix=lf]
        groups: [format]
      - id: trailing-whitespace
        groups: [format]
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
