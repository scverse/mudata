fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: 53e7cebd064fffb1ad6fe11d5309e5348017ae32 # frozen: v2.6.9
    hooks:
      - id: biome-format
        exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
        groups: [format]
  - repo: https://github.com/jolars/panache-pre-commit
    rev: 4822c73a9465f72c7a64ef436c25b15115514c9e # frozen: v3.20.0
    hooks:
      - id: panache-format
        groups: [format]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 02ef6d1c28994054a843e58604e1a343faa42987 # frozen: v2.31.2
    hooks:
      - id: pyproject-fmt
        groups: [format]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        groups: [format]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: hatch check types
        language: system
        types: [python]
        files: ^(src|tests)/
        require_serial: true
        pass_filenames: false
        groups: [typecheck]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
        groups: [format]
      - id: mixed-line-ending
        exclude: ^\.cruft\.json$ # inconsistent file endings on windows - file never to be modified manually.
        args: [--fix=lf]
        groups: [format]
      - id: trailing-whitespace
        groups: [format]
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # frozen: v1.33.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
